<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .container { width: 100%; max-width: 520px; }

  header { margin-bottom: 32px; }

  h1 { font-size: 1.5rem; font-weight: 600; }

  .date {
    font-size: 0.95rem;
    color: #777;
    margin-top: 4px;
  }

  .counter {
    font-size: 0.85rem;
    color: #999;
    margin-top: 12px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .input-row input {
    flex: 1;
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    background: #fff;
  }

  .input-row input:focus { border-color: #888; }

  .carried-label {
    font-size: 0.8rem;
    color: #b08030;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .task-list { list-style: none; }

  .task-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }

  .task-list li:last-child { border-bottom: none; }

  .task-list input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #444;
    flex-shrink: 0;
  }

  .task-text {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
  }

  .task-text.done {
    text-decoration: line-through;
    color: #aaa;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .delete-btn:hover { color: #e55; }

  .section-gap { margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Daily Tasks</h1>
    <div class="date" id="date"></div>
    <div class="counter" id="counter"></div>
  </header>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="Add a task..." autofocus>
  </div>

  <div id="carried-section" class="section-gap" hidden>
    <div class="carried-label">Carried over</div>
    <ul class="task-list" id="carried-list"></ul>
  </div>

  <ul class="task-list" id="task-list"></ul>
</div>

<script>
  var STORAGE_KEY = "daily-tasks";

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function loadData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function init() {
    var today = todayStr();
    var data = loadData();

    if (!data.tasks) data.tasks = [];

    if (data.lastDate && data.lastDate !== today) {
      var carried = [];
      for (var i = 0; i < data.tasks.length; i++) {
        if (!data.tasks[i].done) {
          carried.push({ text: data.tasks[i].text, done: false, carried: true, id: data.tasks[i].id });
        }
      }
      data.tasks = carried;
    }

    data.lastDate = today;
    saveData(data);

    document.getElementById("date").textContent = new Date().toLocaleDateString("en-US", {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });

    render();
  }

  function render() {
    var data = loadData();
    var tasks = data.tasks || [];

    var carriedTasks = [];
    var todayTasks = [];
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].carried) carriedTasks.push(tasks[i]);
      else todayTasks.push(tasks[i]);
    }

    var carriedSection = document.getElementById("carried-section");
    var carriedList = document.getElementById("carried-list");
    var taskList = document.getElementById("task-list");

    carriedList.innerHTML = "";
    taskList.innerHTML = "";

    if (carriedTasks.length > 0) {
      carriedSection.hidden = false;
      for (var i = 0; i < carriedTasks.length; i++) {
        carriedList.appendChild(createTaskEl(carriedTasks[i]));
      }
    } else {
      carriedSection.hidden = true;
    }

    for (var i = 0; i < todayTasks.length; i++) {
      taskList.appendChild(createTaskEl(todayTasks[i]));
    }

    var total = tasks.length;
    var doneCount = 0;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].done) doneCount++;
    }

    var counter = document.getElementById("counter");
    counter.textContent = total > 0 ? doneCount + " of " + total + " done today" : "";
  }

  function createTaskEl(task) {
    var li = document.createElement("li");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = task.done;
    cb.addEventListener("change", function () { toggleTask(task.id); });

    var span = document.createElement("span");
    span.className = "task-text" + (task.done ? " done" : "");
    span.textContent = task.text;

    var btn = document.createElement("button");
    btn.className = "delete-btn";
    btn.textContent = "×";
    btn.title = "Delete";
    btn.addEventListener("click", function () { deleteTask(task.id); });

    li.appendChild(cb);
    li.appendChild(span);
    li.appendChild(btn);
    return li;
  }

  function addTask(text) {
    var data = loadData();
    data.tasks.push({ text: text, done: false, carried: false, id: Date.now() });
    saveData(data);
    render();
  }

  function toggleTask(id) {
    var data = loadData();
    for (var i = 0; i < data.tasks.length; i++) {
      if (data.tasks[i].id === id) {
        data.tasks[i].done = !data.tasks[i].done;
        break;
      }
    }
    saveData(data);
    render();
  }

  function deleteTask(id) {
    var data = loadData();
    data.tasks = data.tasks.filter(function (t) { return t.id !== id; });
    saveData(data);
    render();
  }

  document.getElementById("task-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var text = this.value.trim();
      if (text) {
        addTask(text);
        this.value = "";
      }
    }
  });

  init();
</script>
</body>
</html>
